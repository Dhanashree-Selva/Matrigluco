# Alembic Database Migrations Configuration for MatriGluco

[alembic]
script_location = migrations
prepend_sys_path = .
timezone = UTC
version_locations = %(here)s/migrations/versions
version_path_separator = os

# Dynamic connection string loaded from app.core.config.get_settings().sync_database_url
sqlalchemy.url = mysql+pymysql://root:@localhost:3306/matrigluco?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
