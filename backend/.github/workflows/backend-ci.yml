name: MatriGluco Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test & Quality Gates
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: matrigluco_test
          MYSQL_USER: matrigluco_app
          MYSQL_PASSWORD: test_password_123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: mysql+pymysql://matrigluco_app:test_password_123@127.0.0.1:3306/matrigluco_test
        run: |
          alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          APP_ENV: testing
          DATABASE_URL: mysql+pymysql://matrigluco_app:test_password_123@127.0.0.1:3306/matrigluco_test
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: test_jwt_secret_key_minimum_32_characters_long_for_ci
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing
